name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set up JDK 17
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: chmod +x gradlew

      - name: Build release APK
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            export KEYSTORE_FILE="$PWD/release.keystore"
          fi
          ./gradlew assembleRelease

      - name: Upload Release APK Asset
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          APK_NAME="gotv-${TAG}.apk"
          # Locate built release apk (signed app-release.apk, or fallback app-release-unsigned.apk)
          APK_PATH=$(find app/build/outputs/apk/release/ -maxdepth 1 -name "app-release*.apk" | head -n 1)
          cp "$APK_PATH" "$APK_NAME"
          gh release upload "$TAG" "$APK_NAME" --clobber
